[project]
name = "monitorstress"
version = "0.1.0"
description = "Stress tests for monitors that watch AI agents: a simulated machine with exact ground truth, honest mistakes that break a safety policy, and held-out experiments."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
monitorstress = "monitorstress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitorstress"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: the study is sized for a desktop without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
